# Claude Email Daemon Configuration

# --- Polling ---
poll_interval_seconds: 300  # 5 minutes

# --- Claude's email (IMAP/SMTP) ---
claude_email:
  address: claude@mike-wolf.com
  imap_server: imap.gmail.com
  smtp_server: smtp.gmail.com
  smtp_port: 587
  # App password read from ~/Projects/memory/context/email.md
  # Or set CLAUDE_EMAIL_PW environment variable

# --- Mike's AI email (IMAP for draft checking) ---
# This is a dedicated account for Claude Web/Mobile to leave draft instructions
mike_email:
  address: mikeai@mike-wolf.com
  imap_server: imap.gmail.com
  # App password read from ~/Projects/memory/context/email.md
  # Or set MIKE_EMAIL_PW environment variable

# --- LLM ---
llm:
  endpoint: http://localhost:11434/api/generate
  model: qwen2.5:7b
  temperature: 0.1
  max_tokens: 200

# --- Second opinion (borderline-case adjudicator) ---
# When the fast first-pass classifier flags a trusted-requester email as
# 'destructive' or 'ambiguous', a stronger reasoning model re-judges it on
# REVERSIBILITY and blast radius before we hard-stop or escalate. Reversible
# content edits (e.g. removing a section that's duplicated on another page) are
# reclassified to on_site_build and proceed; only irreversible, high-blast-radius
# work (dropping a database, deleting all records/backups) stays a hard stop.
# Runs via the local `claude` CLI (Claude Code subscription) — the same binary
# cc-dispatch uses. If it's unreachable, the conservative first-pass call stands.
second_opinion:
  enabled: true
  model: opus            # claude CLI alias; resolves to current Opus (4.8-class)
  timeout_seconds: 120

# --- Task decomposition (OFF by default) ---
# When ON, a trusted-requester email may be split into several independently-fated
# tasks: ready build tasks dispatch separately, and blocked ones (missing material
# or needing diagnosis) trigger one threaded "here's what I need" reply to the
# requester. OFF preserves the original single-task-per-email behavior exactly.
# Can be overridden per-requester via `decompose_tasks: true` under a
# trusted_requesters entry below.
# decompose_tasks: false
# decompose:
#   model: opus            # defaults to second_opinion.model when unset
#   timeout_seconds: 180

# --- Provider data-export ingestion (zero-touch email→zip) ---
# Anthropic/OpenAI/Google export-ready emails (forwarded from mw@ via Gmail
# filter — see second-brain/docs/EXPORT-FORWARD-SETUP.md) are recognized and
# their zips downloaded immediately (Anthropic links expire in 24h).
# The URL allowlist is HARD-CODED in daemon.py (PROVIDER_EXPORTS) on purpose —
# config cannot widen the set of hosts this daemon will download from.
provider_exports:
  enabled: true
  max_download_gb: 6          # hard cap on any single export download
  chrome_cdp: http://localhost:9222   # logged-in Chrome for auth-gated links (Takeout)
  chrome_wait_seconds: 180    # how long to wait for a Chrome-initiated zip to land

# --- Draft protocol ---
# Drafts in Mike's Gmail with this subject prefix are treated as
# instructions from Claude Web/Mobile
draft_prefix: "[CLAUDE]"

# --- Forwarding ---
forward_to: mw@mike-wolf.com

# --- Change-request queue (Bill intake + email) ---
# The daemon polls public.change_requests (Supabase URL + service key from .env)
# and routes them. Approval emails deep-link to a specific item via this URL.
changelog_url: https://legends-membership.netlify.app/admin-changelog.html
# Repo a dispatched change request is built in.
change_repo: ~/Projects/legends-membership-site

# --- Logging ---
log_dir: ~/Projects/claude-email-daemon/logs
state_file: ~/Projects/claude-email-daemon/state/processed.json

# --- Action policies ---
# Override LLM decisions for specific senders/patterns
policies:
  always_forward:
    - "@mike-wolf.com"
  always_ignore:
    - "noreply@marketing"
    - "no-reply@notifications"

# --- Dispatch routing ---
# Emails with subject [DISPATCH:Mac|VPS|Hermes] are routed directly to execution
# backends, bypassing the LLM router entirely.
dispatch:
  enabled: true
  allowed_senders:
    - mw@mike-wolf.com
    - mike@embeddedsystemsresearch.org
    - claude@mike-wolf.com
  rate_limit_per_hour: 5
  body_max_bytes: 51200
  platforms:
    Mac:
      command: ~/.local/bin/cc-dispatch
    VPS:
      ssh_target: dev@vpsmikewolf.duckdns.org
      command: ~/.local/bin/cc-dispatch
      # Pin the VPS host key here as a known_hosts entry or key-only value,
      # or pre-populate ~/.ssh/known_hosts for ssh_target.
      # host_key: vpsmikewolf.duckdns.org ssh-ed25519 AAAA...
    Hermes:
      enabled: false  # not yet installed on VPS

# --- Trusted requester pipeline ---
# Per-sender dispatch tiers. Each entry configures how emails from that address are handled.
#
# Tiers:
#   member_services  – auto-dispatch on-site builds under cost_threshold_usd;
#                      escalate destructive / access_control / off_site / high_cost to escalate_to
#   owner            – auto-dispatch everything not caught by hard stops; no cost cap;
#                      hard stops (destructive, access_control) are surfaced as manual-action notices
#
# HARD STOPS (all tiers): destructive, access_control — NEVER auto-executed.
# "destructive" means IRREVERSIBLE / high-blast-radius (dropping a database,
# deleting all records or backups, deleting the whole site/repo) — NOT ordinary
# content removals, which are git-revertable and route to on_site_build. Borderline
# 'destructive'/'ambiguous' calls get a stronger-model second opinion (see
# second_opinion above) before any hard stop.
#
trusted_requesters:
  gfos44@gmail.com:
    name: Greg Foster
    tier: member_services
    auto_dispatch: true
    # CC Mike on every ack and completion email for transparency
    cc_dispatch_to:
      - mw@mike-wolf.com
    # Requests mentioning costs above this threshold go to escalate_to
    cost_threshold_usd: 100
    completion_timeout_hours: 4
    escalate_to: mw@mike-wolf.com
    ack_greeting: "Hi Greg,"
    ack_signature: "Claude\n(AI assistant for the Legends website)"
    site_label: "the Legends website"
    site_description: "A membership site for the Legends of Basketball committee — member directory, event minutes, resources, and member services tools."
    repo: "~/Projects/legends-membership-site"

  # FILL IN: replace eric@ekcosystem.com with Eric's real email address (one-line edit)
  eric@ekcosystem.com:
    name: Eric
    tier: member_services
    auto_dispatch: true
    cc_dispatch_to:
      - mw@mike-wolf.com
    cost_threshold_usd: 100
    completion_timeout_hours: 4
    escalate_to: mw@mike-wolf.com
    ack_greeting: "Hi Eric,"
    ack_signature: "Claude\n(AI assistant for Witness Projection)"
    site_label: "the Witness Projection / Izzy site"
    site_description: "Izzy is the AI dramaturge and life coach collaborator for Eric's play Witness Projection — an AI chat interface with RAG knowledge retrieval, TTS voice, working document, and session history."
    repo: "~/Projects/SOMA/services/izzy-chat"

  mw@mike-wolf.com:
    name: Mike Wolf
    tier: owner
    auto_dispatch: true
    # Dynamic CC: daemon adds member_services senders who were on the thread
    cc_dispatch_to: []
    # No cost cap for owner tier (null = unlimited)
    cost_threshold_usd: null
    completion_timeout_hours: 4
    # No escalate_to — owner IS the escalation target; hard stops surface to owner directly
    ack_greeting: "Hi Mike,"
    ack_signature: "Claude"
